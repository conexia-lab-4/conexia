name: E2E CI

on:
  pull_request:
    branches: [dev, main]

  push:
    branches: [dev, main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: conexia
          POSTGRES_PASSWORD: conexia
          POSTGRES_DB: conexia_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://conexia:conexia@localhost:5432/conexia_db?schema=public
      # Habilita /test-utils/* solo en esta instancia efímera del job, nunca
      # en un ambiente desplegado.
      E2E_TESTING: 'true'
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_API_BASE_URL: http://localhost:3000
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_BASE_URL: http://localhost:5173
      E2E_API_BASE_URL: http://localhost:3000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: ./backend
        run: npm install

      - name: Generar cliente de Prisma
        working-directory: ./backend
        run: npx prisma generate

      - name: Correr migraciones
        working-directory: ./backend
        run: npx prisma migrate deploy

      - name: Buildear backend
        working-directory: ./backend
        run: npm run build

      - name: Levantar backend en background
        working-directory: ./backend
        run: nohup npm run start:prod > backend.log 2>&1 &

      - name: Esperar a que el backend esté listo
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3000; then
              echo "Backend listo"
              exit 0
            fi
            sleep 2
          done
          echo "El backend no respondió a tiempo" >&2
          exit 1

      - name: Instalar dependencias del frontend
        working-directory: ./frontend
        run: npm install

      - name: Instalar dependencias de e2e
        working-directory: ./e2e
        run: npm install

      - name: Instalar browsers de Playwright
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium

      - name: Correr tests E2E
        working-directory: ./e2e
        run: npm run test:e2e

      - name: Subir artifacts de diagnóstico
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            e2e/playwright-report/
            e2e/test-results/
            backend/backend.log
          retention-days: 7
